<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamish Baxter | Global Portfolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(18, 18, 22, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #888899;
            --accent: #ffffff;
            --modal-width: 45vw;
            --font-display: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
        }

        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #050505;
            font-family: var(--font-body);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        #canvas-container {
            width: 100vw; height: 100vh;
            position: absolute; top: 0; left: 0; z-index: 1;
            transition: filter 0.8s ease-out;
        }
        .blurry-start { filter: blur(12px); }

        /* ── LOADING ── */
        #cms-loader {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050505; z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s ease;
        }
        .loader-spinner {
            width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid #fff; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #cms-loader p { font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }

        /* ── INTRO ── */
        #intro-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; pointer-events: none;
            color: white; text-align: center;
            text-shadow: 0 4px 12px rgba(0,0,0,0.8);
            transition: opacity 0.8s ease-in-out;
        }
        .intro-name { font-family: var(--font-display); font-size: 3rem; margin: 0 0 10px 0; font-weight: 400; }
        .intro-sub  { font-size: 0.9rem; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 40px; }
        .intro-instruction { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; }

        /* ── UI LAYER ── */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 40px; box-sizing: border-box;
        }
        header { pointer-events: auto; }
        h1 { margin: 0; font-family: var(--font-display); font-size: 2rem; font-weight: 400; letter-spacing: 1px; }
        p.subtitle { margin: 6px 0 0 0; font-size: 0.85rem; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; font-weight: 500; line-height: 1.9; }
        .nav-subtitle-link { cursor: pointer; transition: color 0.2s; }
        .nav-subtitle-link:hover { color: #ffffff; }
        .subtitle-sep { margin: 0 6px; opacity: 0.4; }

        /* ── NAV: vertical pill on the left, expands on hover ── */
        #dynamic-nav {
            position: absolute; top: 50%; left: 24px; transform: translateY(-50%);
            background: rgba(25, 25, 30, 0.6);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 32px;
            padding: 8px; display: flex; flex-direction: column; gap: 4px;
            width: 54px; box-sizing: border-box;
            transition: width 0.4s cubic-bezier(0.175,0.885,0.32,1.275), background 0.3s;
            overflow: hidden; z-index: 100; pointer-events: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        #dynamic-nav:hover { width: 210px; background: rgba(25,25,30,0.85); }
        .nav-item {
            display: flex; align-items: center; padding: 10px 8px; border-radius: 24px;
            cursor: pointer; color: var(--text-muted);
            transition: background 0.3s, color 0.3s;
            white-space: nowrap; overflow: hidden;
        }
        .nav-item:hover  { color: var(--text-main); background: rgba(255,255,255,0.05); }
        .nav-item.active { color: var(--text-main); background: rgba(255,255,255,0.15); }
        .nav-icon  { width: 22px; height: 22px; flex-shrink: 0; margin: 0 3px; }
        .nav-label { font-weight: 400; font-size: 0.85rem; letter-spacing: 0.5px; opacity: 0; margin-left: 10px; transform: translateX(-6px); transition: opacity 0.25s, transform 0.25s; }
        #dynamic-nav:hover .nav-label { opacity: 1; transform: translateX(0); transition-delay: 0.08s; }

        /* ── FOOTER ── */
        #global-footer {
            position: absolute; bottom: 40px; left: 40px; pointer-events: auto;
            display: flex; gap: 20px; align-items: center;
            font-size: 0.75rem; font-weight: 500; letter-spacing: 1px; text-transform: uppercase;
            color: var(--text-muted); z-index: 10;
        }
        #global-footer a { color: var(--text-main); text-decoration: none; transition: opacity 0.3s; }
        #global-footer a:hover { opacity: 0.7; }
        .footer-divider { width: 1px; height: 12px; background: rgba(255,255,255,0.2); }

        /* ── PAGE OVERLAY ── */
        #page-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 40; pointer-events: none; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.0); transition: background 0.5s ease;
        }
        #page-overlay.active { pointer-events: auto; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

        .page-content {
            width: 60vw; max-width: 800px; max-height: 85vh;
            background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 60px;
            opacity: 0; transform: translateY(20px) scale(0.98);
            transition: all 0.5s cubic-bezier(0.2,0.8,0.2,1);
            display: none; overflow-y: auto; box-sizing: border-box;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8);
        }
        .page-content.active { display: block; opacity: 1; transform: translateY(0) scale(1); }
        .page-content::-webkit-scrollbar { width: 6px; }
        .page-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        .page-title    { font-family: var(--font-display); font-size: 3rem; font-weight: 400; margin-top: 0; margin-bottom: 20px; }
        .page-subtitle { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 40px; font-weight: 400; letter-spacing: 0.5px; text-transform: uppercase; }
        .page-text     { font-size: 1.1rem; line-height: 1.8; color: #d0d0d0; margin-bottom: 25px; font-weight: 300; }
        .highlight     { color: #ffffff; font-weight: 500; }
        .inline-link   { color: #ffffff; text-decoration: underline; text-underline-offset: 3px; opacity: 0.8; transition: opacity 0.2s; }
        .inline-link:hover { opacity: 1; }

        /* ── AT A GLANCE CARD ── */
        .glance-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 22px 26px;
            margin-bottom: 28px;
        }
        .glance-card-heading {
            font-size: 0.7rem; font-weight: 600; letter-spacing: 2px;
            text-transform: uppercase; color: var(--text-muted);
            margin: 0 0 14px 0;
        }
        .glance-card ul {
            margin: 0; padding: 0; list-style: none;
            display: flex; flex-direction: column; gap: 8px;
        }
        .glance-card ul li a {
            font-size: 0.9rem; color: rgba(255,255,255,0.75);
            text-decoration: none; line-height: 1.5;
            display: flex; align-items: flex-start; gap: 10px;
            transition: color 0.2s;
        }
        .glance-card ul li a:before {
            content: ''; display: block; width: 5px; height: 5px;
            border-radius: 50%; background: rgba(255,255,255,0.3);
            flex-shrink: 0; margin-top: 7px;
        }
        .glance-card ul li a:hover { color: #ffffff; }
        .glance-card ul li a:hover:before { background: #ffffff; }

        /* ── BLOCK SECTION HEADING ── */
        .block-section-heading {
            font-size: 0.7rem; font-weight: 600; letter-spacing: 2px;
            text-transform: uppercase; color: var(--text-muted);
            margin: 28px 0 10px 0; padding-top: 4px;
        }
        .block-gallery .block-section-heading,
        .block-image-wrap .block-section-heading { margin-top: 24px; }

        /* ── DIGITAL SPLIT PANEL ── */
        #page-uxui {
            width: 85vw; max-width: 1300px; padding: 0; display: none; overflow: hidden;
            flex-direction: row; align-items: stretch;
        }
        #page-uxui.active { display: flex; opacity: 1; transform: translateY(0) scale(1); }
        .digital-sidebar {
            width: 35%; border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column; background: rgba(0,0,0,0.2);
        }
        .digital-sidebar-header {
            padding: 35px 30px 20px; border-bottom: 1px solid var(--glass-border);
        }
        .digital-sidebar-title { font-family: var(--font-display); font-size: 1.8rem; margin: 0; font-weight: 400; }
        .digital-list { flex: 1; overflow-y: auto; padding: 15px; }
        .digital-list::-webkit-scrollbar { width: 4px; }
        .digital-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
        .digital-list-item {
            padding: 18px 20px; border-radius: 12px; cursor: pointer;
            transition: all 0.2s; border: 1px solid transparent; margin-bottom: 8px;
        }
        .digital-list-item:hover { background: rgba(255,255,255,0.05); }
        .digital-list-item.active { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); }
        .digital-item-title { font-size: 1rem; font-weight: 500; margin-bottom: 4px; color: #fff; }
        .digital-item-sub   { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .digital-main { width: 65%; padding: 40px 50px; overflow-y: auto; scroll-behavior: smooth; }
        .digital-main::-webkit-scrollbar { width: 6px; }
        .digital-main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        /* ── ARCHITECTURE MODAL ── */
        #project-modal {
            position: absolute; top: 0; right: 0; height: 100vh; width: var(--modal-width);
            min-width: 400px; max-width: 85vw; padding: 40px; box-sizing: border-box;
            border-radius: 24px 0 0 24px; background: var(--glass-bg);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-left: 1px solid var(--glass-border); box-shadow: -20px 0 60px rgba(0,0,0,0.6);
            pointer-events: auto; opacity: 0; visibility: hidden;
            transition: opacity 0.25s, transform 0.4s cubic-bezier(0.2,0.8,0.2,1);
            display: flex; flex-direction: column; z-index: 60;
        }
        #project-modal.active { opacity: 1; visibility: visible; transform: translateX(0); }
        #project-modal.hidden-state { transform: translateX(100%); }

        #modal-resizer {
            position: absolute; left: 0; top: 0; width: 8px; height: 100%;
            cursor: ew-resize; z-index: 20; background: rgba(255,255,255,0.0); transition: background 0.2s;
        }
        #modal-resizer:hover, #modal-resizer.dragging { background: rgba(255,255,255,0.15); }

        #modal-scroll-area { flex: 1; overflow-y: auto; padding-right: 15px; scroll-behavior: smooth; }
        #modal-scroll-area::-webkit-scrollbar { width: 4px; }
        #modal-scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

        #modal-top-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 25px; padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 20; flex-shrink: 0;
        }
        .nav-controls { display: flex; align-items: center; gap: 6px; flex: 1; }
        .nav-btn {
            background: transparent; border: none; color: var(--text-muted);
            width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s; padding: 0; outline: none;
        }
        .nav-btn svg { width: 18px; height: 18px; stroke-width: 2px; }
        .nav-btn:hover { background: rgba(255,255,255,0.08); color: #fff; transform: scale(1.05); }

        .search-container { flex: 1; max-width: 240px; position: relative; margin-left: 10px; }
        #project-search {
            width: 100%; padding: 8px 16px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.2);
            color: white; font-size: 0.85rem; font-weight: 300; font-family: var(--font-body);
            outline: none; transition: all 0.3s; box-sizing: border-box;
        }
        #project-search::placeholder { color: rgba(255,255,255,0.3); }
        #project-search:focus { border-color: rgba(255,255,255,0.3); background: rgba(0,0,0,0.4); }
        #search-results {
            position: absolute; top: 40px; left: 0; width: 100%;
            background: rgba(25,25,30,0.95); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 12px;
            max-height: 250px; overflow-y: auto; display: none; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100;
        }
        #search-results.active { display: flex; }
        .search-result-item {
            padding: 10px 14px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s; text-align: left; font-size: 0.9rem;
        }
        .search-result-item:hover { background: rgba(255,255,255,0.1); }
        .search-result-item:last-child { border-bottom: none; }

        .modal-close {
            cursor: pointer; margin-left: 15px;
            font-size: 1.2rem; color: var(--text-muted); transition: color 0.3s, text-shadow 0.3s;
            display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;
        }
        .modal-close:hover { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.4); }

        /* ── STATUS BADGES ── */
        .status-badge {
            display: inline-block; padding: 4px 10px; border-radius: 12px;
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px;
            margin-bottom: 15px; font-weight: 600;
        }
        .badge-built   { background: rgba(77,168,218,0.15); color: #6bc2f3; border: 1px solid rgba(77,168,218,0.3); }
        .badge-concept { background: rgba(168,77,218,0.15); color: #d7a8f8; border: 1px solid rgba(168,77,218,0.3); }
        .badge-digital { background: rgba(77,218,140,0.15); color: #6bf3a4; border: 1px solid rgba(77,218,140,0.3); }

        /* ── PROJECT CONTENT BLOCKS ── */
        .modal-title    { font-family: var(--font-display); margin: 0 0 8px 0; font-size: 3rem; font-weight: 400; line-height: 1.1; }
        .modal-subtitle { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500; margin: 0 0 14px 0; }
        .modal-header-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .modal-location { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; font-weight: 500; }
        .project-divider { border: 0; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%); margin: 0 0 25px 0; }
        .modal-desc { font-size: 1.05rem; line-height: 1.8; color: #d4d4d4; margin-bottom: 30px; font-weight: 300; }

        /* Block: text */
        .block-text {
            font-size: 1.05rem; line-height: 1.85; color: #d4d4d4;
            margin-bottom: 28px; font-weight: 300;
        }

        /* Block: image */
        .block-image {
            margin-bottom: 28px;
        }
        .block-image img {
            width: 100%; border-radius: 12px;
            display: block; object-fit: cover;
            background: #111;
        }
        .block-image-caption {
            font-size: 0.75rem; color: var(--text-muted); margin-top: 8px;
            letter-spacing: 0.5px; text-align: center; font-style: italic;
        }

        /* Block: gallery (accordion) */
        .block-gallery { margin-bottom: 28px; }
        .gallery-container {
            display: flex; gap: 8px; width: 100%; height: 280px;
        }
        .gallery-item {
            flex: 1; border-radius: 12px; overflow: hidden; cursor: pointer; position: relative;
            transition: flex 0.55s cubic-bezier(0.25,1,0.3,1), filter 0.4s;
            filter: brightness(0.55); background-color: #111;
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }
        .gallery-item.active { flex: 5; filter: brightness(1); cursor: zoom-in; }
        .gallery-item:hover:not(.active) { filter: brightness(0.8); }

        /* Block: bullets */
        .block-bullets { margin-bottom: 28px; }
        .block-bullets-heading {
            font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase;
            color: var(--text-muted); margin-bottom: 14px; font-weight: 600;
        }
        .block-bullets ul {
            margin: 0; padding: 0; list-style: none;
            border-left: 1px solid rgba(255,255,255,0.12);
        }
        .block-bullets ul li {
            padding: 8px 0 8px 20px; font-size: 0.95rem; line-height: 1.6;
            color: #c8c8d8; font-weight: 300; position: relative;
        }
        .block-bullets ul li::before {
            content: '—'; position: absolute; left: 0;
            color: rgba(255,255,255,0.25); font-size: 0.8rem;
        }

        /* Block: section divider */
        .block-divider {
            border: 0; height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
            margin: 10px 0 28px 0;
        }

        /* ── SKELETON LOADING ── */
        @keyframes pulse {
            0%, 100% { background-color: rgba(255,255,255,0.03); }
            50%       { background-color: rgba(255,255,255,0.08); }
        }
        .skeleton { animation: pulse 1.5s infinite ease-in-out; border-radius: 6px; }
        .skel-badge { width: 80px; height: 22px; margin-bottom: 15px; border-radius: 12px; }
        .skel-title { width: 80%; height: 38px; margin-bottom: 12px; }
        .skel-loc   { width: 40%; height: 16px; margin-bottom: 25px; }
        .skel-text  { width: 100%; height: 18px; margin-bottom: 12px; }
        .skel-text.short { width: 70%; }
        .skel-gallery { width: 100%; height: 280px; margin-bottom: 28px; border-radius: 12px; }

        /* ── LIGHTBOX ── */
        #lightbox-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(15px);
            z-index: 9999; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #lightbox-overlay.active { opacity: 1; pointer-events: auto; }
        #lightbox-image {
            width: 90vw; height: 90vh;
            background-size: contain; background-position: center; background-repeat: no-repeat;
            border-radius: 8px;
        }
        .lightbox-close {
            position: absolute; top: 30px; right: 40px; cursor: pointer;
            font-size: 2rem; color: rgba(255,255,255,0.6); transition: color 0.3s, transform 0.3s;
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
        }
        .lightbox-close:hover { color: #fff; transform: scale(1.1); }

        /* ── MOBILE ── */
        @media (max-width: 768px) {
            #ui-layer { padding: 20px; }
            #intro-overlay { padding: 0 20px; }
            .intro-name { font-size: 2.2rem; }
            #global-footer { bottom: 85px; left: 20px; flex-direction: column; align-items: flex-start; gap: 8px; }
            .footer-divider { display: none; }
            #dynamic-nav {
                top: 50%; left: 10px; transform: translateY(-50%);
                width: 46px; flex-direction: column; padding: 6px; border-radius: 28px; gap: 4px;
            }
            #dynamic-nav:hover { width: 46px; }
            .nav-label { display: none; }
            .nav-item { padding: 10px 8px; justify-content: center; }
            .nav-icon { margin: 0; }
            .page-content { width: 90vw; padding: 30px 25px; max-height: 75vh; }
            .page-title { font-size: 2.2rem; }
            #page-uxui { flex-direction: column; overflow-y: auto; }
            .digital-sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--glass-border); }
            .digital-main { width: 100%; padding: 30px 0; overflow-y: visible; }
            #project-modal {
                top: auto; bottom: 0; left: 0; right: 0;
                width: 100vw; height: 85vh; max-height: 85vh; min-width: 100vw;
                border-radius: 28px 28px 0 0; padding: 30px 25px;
                border-left: none; border-top: 1px solid var(--glass-border);
            }
            #project-modal.active { transform: translateY(0); }
            #project-modal.hidden-state { transform: translateY(100%); }
            #modal-resizer { display: none; }
            .gallery-container { height: 200px; }
            .lightbox-close { top: 15px; right: 15px; font-size: 1.5rem; }
            #lightbox-image { width: 95vw; height: 85vh; }
        }
    </style>
</head>
<body>

    <div id="cms-loader">
        <div class="loader-spinner"></div>
        <p>Loading Portfolio...</p>
    </div>

    <div id="canvas-container" class="blurry-start"></div>
    
    <div id="intro-overlay">
        <h1 class="intro-name">Hamish Baxter</h1>
        <div class="intro-sub">Global Architecture Portfolio</div>
        <div class="intro-instruction">Drag to explore</div>
    </div>
    
    <div id="tooltip" style="position:fixed;background:rgba(0,0,0,0.7);color:#fff;padding:6px 12px;border-radius:8px;font-size:0.75rem;letter-spacing:1px;text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity 0.2s;z-index:200;"></div>

    <!-- Navigation -->

    <script>
    // ═══════════════════════════════════════════════════════
    // CONTENT BLOCK RENDERER
    // ═══════════════════════════════════════════════════════
    function renderBlocks(blocks, containerEl) {
        if (!blocks || !blocks.length) return;
        containerEl.innerHTML = '';

        blocks.forEach(block => {
            switch(block.type) {

                case 'text': {
                    const textWrap = document.createElement('div');
                    if (block.id) textWrap.id = block.id;
                    if (block.heading) {
                        const sh = document.createElement('p');
                        sh.className = 'block-section-heading';
                        sh.textContent = block.heading;
                        textWrap.appendChild(sh);
                    }
                    const el = document.createElement('p');
                    el.className = 'block-text';
                    el.innerHTML = block.body;
                    textWrap.appendChild(el);
                    containerEl.appendChild(textWrap);
                    break;
                }

                case 'image': {
                    const wrap = document.createElement('div');
                    wrap.className = 'block-image';
                    const img = document.createElement('img');
                    img.src = block.src;
                    img.alt = block.caption || '';
                    img.loading = 'lazy';
                    img.onclick = () => openLightbox(block.src);
                    wrap.appendChild(img);
                    if (block.caption) {
                        const cap = document.createElement('p');
                        cap.className = 'block-image-caption';
                        cap.textContent = block.caption;
                        wrap.appendChild(cap);
                    }
                    containerEl.appendChild(wrap);
                    break;
                }

                case 'gallery': {
                    const wrap = document.createElement('div');
                    wrap.className = 'block-gallery';
                    if (block.id) wrap.id = block.id;
                    if (block.heading) {
                        const sh = document.createElement('p');
                        sh.className = 'block-section-heading';
                        sh.textContent = block.heading;
                        wrap.appendChild(sh);
                    }
                    const gallery = document.createElement('div');
                    gallery.className = 'gallery-container';
                    (block.images || []).slice(0, 6).forEach((src, i) => {
                        const item = document.createElement('div');
                        item.className = 'gallery-item' + (i === 0 ? ' active' : '');
                        item.style.backgroundImage = `url('${src}')`;
                        item.onclick = function() { selectGalleryItem(this); };
                        gallery.appendChild(item);
                    });
                    wrap.appendChild(gallery);
                    containerEl.appendChild(wrap);
                    break;
                }

                case 'bullets': {
                    const isGlance = block.heading === 'At a Glance';
                    const wrap = document.createElement('div');
                    wrap.className = isGlance ? 'glance-card' : 'block-bullets';
                    if (block.heading) {
                        const h = document.createElement('p');
                        h.className = isGlance ? 'glance-card-heading' : 'block-bullets-heading';
                        h.textContent = block.heading;
                        wrap.appendChild(h);
                    }
                    const ul = document.createElement('ul');
                    (block.items || []).forEach(item => {
                        const li = document.createElement('li');
                        // Support both plain strings and {label, anchor} objects
                        if (typeof item === 'object' && item.anchor) {
                            const a = document.createElement('a');
                            a.textContent = item.label;
                            a.href = '#' + item.anchor;
                            a.addEventListener('click', function(e) {
                                e.preventDefault();
                                // Find the scroll container (modal or digital-main)
                                const scrollEl = containerEl.closest('#modal-scroll-area') || containerEl.closest('.digital-main');
                                const target = containerEl.querySelector('#' + item.anchor);
                                if (scrollEl && target) {
                                    const offset = target.offsetTop - scrollEl.offsetTop - 20;
                                    scrollEl.scrollTo({ top: offset, behavior: 'smooth' });
                                }
                            });
                            li.appendChild(a);
                        } else {
                            li.innerHTML = typeof item === 'string' ? item : item.label;
                        }
                        ul.appendChild(li);
                    });
                    wrap.appendChild(ul);
                    containerEl.appendChild(wrap);
                    break;
                }

                case 'divider': {
                    const hr = document.createElement('hr');
                    hr.className = 'block-divider';
                    containerEl.appendChild(hr);
                    break;
                }
            }
        });
    }

    // Render page header (badge, title, subtitle, location) then content blocks
    function renderProjectHeader(data, containerEl, badgeClass, badgeText) {
        const subtitleHtml = data.subtitle
            ? `<p class="modal-subtitle">${data.subtitle}</p>`
            : '';
        const header = document.createElement('div');
        header.className = 'project-header';
        header.innerHTML = `
            <h1 class="modal-title">${data.title}</h1>
            ${subtitleHtml}
            <div class="modal-header-meta">
                <div class="status-badge ${badgeClass}">${badgeText}</div>
                <div class="modal-location">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"></circle><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path></svg>
                    ${data.airport}
                </div>
            </div>
            <hr class="project-divider">
        `;
        containerEl.appendChild(header);
    }

    function openLightbox(src) {
        const lightboxImg = document.getElementById('lightbox-image');
        lightboxImg.style.backgroundImage = `url('${src}')`;
        lightboxImg.style.backgroundSize = 'contain';
        lightboxImg.style.backgroundPosition = 'center';
        lightboxImg.style.backgroundRepeat = 'no-repeat';
        document.getElementById('lightbox-overlay').classList.add('active');
    }

    window.selectGalleryItem = function(element) {
        if (element.classList.contains('active')) {
            const src = element.style.backgroundImage.replace(/url\(['"]?(.*?)['"]?\)/, '$1');
            openLightbox(src);
            return;
        }
        Array.from(element.parentNode.children).forEach(el => el.classList.remove('active'));
        element.classList.add('active');
    };

    // ═══════════════════════════════════════════════════════
    // APP INIT
    // ═══════════════════════════════════════════════════════
    function initApp() {
        // Populate static pages from data.js
        const aboutData = pageData.find(p => p.id === 'about');
        if (aboutData) {
            document.getElementById('about-title').textContent = aboutData.title;
            document.getElementById('about-subtitle').textContent = aboutData.subtitle;

            document.getElementById('ai-title').textContent = aiData.title;
            document.getElementById('ai-subtitle').textContent = aiData.subtitle;
            renderBlocks(aiData.content, document.getElementById('ai-body'));

        // Populate Digital list
        const digitalList = document.getElementById('digital-project-list');
        digitalList.innerHTML = digitalProjects.map((p, i) => `
            <div class="digital-list-item" onclick="loadDigitalProject(${i})">
                <div class="digital-item-title">${p.title}</div>
                <div class="digital-item-sub">${p.airport}</div>

        if (digitalProjects.length > 0) loadDigitalProject(0);

        document.getElementById('project-count').textContent = `${globeProjects.length + digitalProjects.length} Projects Indexed`;

        document.getElementById('cms-loader').style.opacity = '0';
        setTimeout(() => {

    // ═══════════════════════════════════════════════════════
    // DIGITAL PROJECT RENDERER
    // ═══════════════════════════════════════════════════════
    window.loadDigitalProject = function(index) {
        document.querySelectorAll('.digital-list-item').forEach((el, i) => {
            el.classList.toggle('active', i === index);
        });
        const data = digitalProjects[index];
        if (!data) return;

        const zone = document.getElementById('digital-content-zone');
        zone.innerHTML = '';

        const badgeClass = data.status === 'built' ? 'badge-digital' : 'badge-concept';
        const badgeText  = data.status === 'built' ? 'Live Product' : 'UX Concept';
        renderProjectHeader(data, zone, badgeClass, badgeText);
        renderBlocks(data.content, zone);

        document.getElementById('digital-main-content').scrollTop = 0;
    };

    // ═══════════════════════════════════════════════════════
    // ARCHITECTURE MODAL RENDERER
    // ═══════════════════════════════════════════════════════
    let currentProjectIndex = -1;

    function openModal(data) {
        currentProjectIndex = globeProjects.findIndex(p => p.id === data.id);
        const modal    = document.getElementById('project-modal');
        const zone     = document.getElementById('modal-content-zone');
        const scrollEl = document.getElementById('modal-scroll-area');

        modal.classList.remove('hidden-state');
        modal.classList.add('active');
        scrollEl.scrollTop = 0;

        // Show skeleton
        zone.innerHTML = `
            <div class="skeleton skel-badge"></div>
            <div class="skeleton skel-title"></div>
            <div class="skeleton skel-loc"></div>
            <div class="skeleton skel-gallery"></div>
            <div class="skeleton skel-text"></div>
            <div class="skeleton skel-text"></div>
            <div class="skeleton skel-text short"></div>
        `;

        // Render real content after brief delay (feels snappy, not instant)
        setTimeout(() => {
            zone.innerHTML = '';
            const badgeClass = data.status === 'built' ? 'badge-built' : 'badge-concept';
            const badgeText  = data.status === 'built' ? 'Built' : 'Concept';
            renderProjectHeader(data, zone, badgeClass, badgeText);
            renderBlocks(data.content, zone);
        }, 280);
    }

    // ═══════════════════════════════════════════════════════
    // THREE.JS GLOBE ENGINE
    // ═══════════════════════════════════════════════════════
    let scene, camera, renderer, controls, globeGroup;
    let markers = [], clusters = [], starSystems = [], lineUniforms;
    let hoveredSprite = null, isAnimatingCamera = false, isPageOpen = false;
    let globeMeshRef = null;
    const GLOBE_RADIUS = 1;
    const mouse = new THREE.Vector2();

    function initThreeJSEngine() {
        lineUniforms = {
            uMousePos: { value: new THREE.Vector3(0,0,0) },
            uHoverRadius: { value: 0.35 },
            uGlowColor: { value: new THREE.Color(0x4facfe) }
        };

        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.08);

        camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 4.5);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;
        controls.enablePan = false; controls.minDistance = 1.5; controls.maxDistance = 6.0;
        controls.autoRotate = false; controls.autoRotateSpeed = 0.4;

        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2); sunLight.position.set(5,3,5); scene.add(sunLight);
        const rimLight = new THREE.DirectionalLight(0x88aaff, 0.8); rimLight.position.set(-5,0,-5); scene.add(rimLight);

        globeGroup = new THREE.Group();
        globeGroup.rotation.y = -Math.PI / 2;
        scene.add(globeGroup);

        const baseGlobe = new THREE.Mesh(
            new THREE.SphereGeometry(GLOBE_RADIUS * 0.99, 64, 64),
            new THREE.MeshBasicMaterial({ color: 0x050505 })
        );
        globeGroup.add(baseGlobe);
        globeMeshRef = baseGlobe;

        // Atmosphere
        const atmosMat = new THREE.ShaderMaterial({
            vertexShader: `varying vec3 vNormal; void main() { vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `varying vec3 vNormal; void main() { float intensity = pow(0.55 - dot(vNormal, vec3(0,0,1.0)), 3.0); gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity * 1.2; }`,
            blending: THREE.AdditiveBlending, side: THREE.BackSide, transparent: true, depthWrite: false
        });
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(GLOBE_RADIUS * 1.15, 64, 64), atmosMat));

        // Country outlines
        const lineMatBase = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 });
        const interactiveLineMat = new THREE.ShaderMaterial({
            uniforms: lineUniforms,
            vertexShader: `varying vec3 vWorldPosition; void main() { vec4 wp = modelMatrix * vec4(position, 1.0); vWorldPosition = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`,
            fragmentShader: `uniform vec3 uMousePos; uniform float uHoverRadius; uniform vec3 uGlowColor; varying vec3 vWorldPosition; void main() { float dist = distance(vWorldPosition, uMousePos); float intensity = pow(max(0.0, 1.0 - (dist / uHoverRadius)), 2.0); gl_FragColor = vec4(uGlowColor * intensity * 1.5, intensity * 0.9); }`,
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        });

        fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
            .then(res => res.json())
            .then(data => {
                function makeLineGeom(coords, r) {
                    return new THREE.BufferGeometry().setFromPoints(
                        coords.map(c => latLngToVec3(c[1], c[0], GLOBE_RADIUS * r))
                    );
                }
                data.features.forEach(f => {
                    const process = rings => rings.forEach(ring => {
                        globeGroup.add(new THREE.Line(makeLineGeom(ring, 1.0), lineMatBase));
                        globeGroup.add(new THREE.Line(makeLineGeom(ring, 1.002), interactiveLineMat));
                    });
                    if (f.geometry.type === 'Polygon') process(f.geometry.coordinates);
                    else if (f.geometry.type === 'MultiPolygon') f.geometry.coordinates.forEach(p => process(p));
                });
            });

        // Stars
        for (let j = 0; j < 3; j++) {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(1000 * 3);
            for (let i = 0; i < 1000; i++) {
                const r = 150 + Math.random() * 150, u = Math.random(), v = Math.random();
                const th = u * 2 * Math.PI, ph = Math.acos(2*v - 1);
                pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
                pos[i*3+1] = r * Math.cos(ph);
                pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({ size: 1+Math.random(), color: 0xffffff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
            const sys = new THREE.Points(geo, mat);
            scene.add(sys);
            starSystems.push({ mesh: sys, speed: 0.001 + Math.random() * 0.002, baseOpacity: 0.4 + Math.random() * 0.3 });
        }

        buildMarkers();
        setupInteractivity();

        requestAnimationFrame(animate);
        setTimeout(() => { container.classList.remove('blurry-start'); controls.autoRotate = true; }, 500);
        setTimeout(() => { document.getElementById('intro-overlay').style.opacity = '0'; }, 1500);
    }

    function latLngToVec3(lat, lon, r) {
        const phi = (90 - lat) * (Math.PI / 180), theta = (lon + 180) * (Math.PI / 180);
        return new THREE.Vector3(-(r * Math.sin(phi) * Math.cos(theta)), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
    }

    function makeMarkerTexture() {
        const c = document.createElement('canvas'); c.width = c.height = 128; const ctx = c.getContext('2d');
        ctx.beginPath(); ctx.arc(64,64,36,0,2*Math.PI); ctx.fillStyle = '#ffffff'; ctx.fill();
        ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.stroke();
        return new THREE.CanvasTexture(c);
    }
    function makeClusterTexture(count) {
        const c = document.createElement('canvas'); c.width = c.height = 128; const ctx = c.getContext('2d');
        ctx.beginPath(); ctx.arc(64,64,44,0,2*Math.PI); ctx.fillStyle = '#ffffff'; ctx.fill();
        ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.stroke();
        ctx.fillStyle = '#050505'; ctx.font = 'bold 44px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(count, 64, 67);
        return new THREE.CanvasTexture(c);
    }

    function buildMarkers() {
        const markerMat = new THREE.SpriteMaterial({ map: makeMarkerTexture(), sizeAttenuation: true, depthWrite: false });
        const clusterData = [];

        globeProjects.forEach(project => {
            const pos = latLngToVec3(project.lat, project.lon, GLOBE_RADIUS + 0.05);
            let added = false;
            for (let c of clusterData) {
                if (c.center.distanceTo(pos) < 0.25) { c.projects.push(project); added = true; break; }
            }
            if (!added) clusterData.push({ center: pos, centerLat: project.lat, centerLon: project.lon, projects: [project] });
        });

        clusterData.forEach(cluster => {
            if (cluster.projects.length === 1) {
                const sprite = new THREE.Sprite(markerMat);
                sprite.position.copy(cluster.center); sprite.scale.set(0.04,0.04,0.04);
                sprite.userData = { isCluster: false, data: cluster.projects[0] };
                globeGroup.add(sprite); markers.push(sprite);
                cluster.projects[0].scenePosition = cluster.center.clone();
            } else {
                const clSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeClusterTexture(cluster.projects.length), sizeAttenuation: true, depthWrite: false }));
                clSprite.position.copy(cluster.center); clSprite.scale.set(0.05,0.05,0.05);
                clSprite.userData = { isCluster: true, count: cluster.projects.length };
                globeGroup.add(clSprite); markers.push(clSprite);
                cluster.clusterSprite = clSprite; cluster.individualSprites = [];

                const spreadAngle = (Math.PI * 2) / cluster.projects.length;
                const radiusOffset = 1.0 + (cluster.projects.length * 0.15);
                const lonScale = 1 / Math.cos(cluster.centerLat * (Math.PI / 180));

                cluster.projects.forEach((proj, index) => {
                    const angle = index * spreadAngle;
                    const spreadPos = latLngToVec3(
                        cluster.centerLat + Math.cos(angle) * radiusOffset,
                        cluster.centerLon + Math.sin(angle) * radiusOffset * lonScale,
                        GLOBE_RADIUS + 0.05
                    );
                    const sprite = new THREE.Sprite(markerMat);
                    sprite.position.copy(spreadPos); sprite.scale.set(0.035,0.035,0.035);
                    sprite.userData = { isCluster: false, data: proj }; sprite.visible = false;
                    globeGroup.add(sprite); markers.push(sprite);
                    proj.scenePosition = spreadPos.clone(); cluster.individualSprites.push(sprite);
                });

                clusters.push(cluster);
            }
        });
    }

    function flyTo(targetVector, callback, targetZoom = 2.2) {
        isAnimatingCamera = true; controls.autoRotate = false; controls.enabled = false;
        const worldTarget = targetVector.clone().applyMatrix4(globeGroup.matrixWorld);
        const targetSpherical = new THREE.Spherical().setFromVector3(worldTarget.clone().normalize().multiplyScalar(targetZoom));
        const thetaOffset = window.innerWidth <= 768 ? 0 : Math.PI / 7.5;
        targetSpherical.theta += thetaOffset;
        const currentSpherical = new THREE.Spherical().setFromVector3(camera.position);
        let diff = targetSpherical.theta - currentSpherical.theta;
        if (diff > Math.PI) targetSpherical.theta -= 2*Math.PI;
        if (diff < -Math.PI) targetSpherical.theta += 2*Math.PI;

        new TWEEN.Tween(currentSpherical).to({
            radius: targetSpherical.radius, phi: targetSpherical.phi, theta: targetSpherical.theta
        }, 650).easing(TWEEN.Easing.Cubic.InOut)
        .onUpdate(() => { camera.position.setFromSpherical(currentSpherical); camera.lookAt(0,0,0); })
        .onComplete(() => { controls.enabled = true; isAnimatingCamera = false; if(callback) callback(); })
        .start();
    }

    function setupInteractivity() {
        const modal = document.getElementById('project-modal');
        const resizer = document.getElementById('modal-resizer');
        const navItems = document.querySelectorAll('.nav-item');
        const pageOverlay = document.getElementById('page-overlay');
        const pages = document.querySelectorAll('.page-content');
        let isResizing = false;

        // Nav
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const target = item.getAttribute('data-target');
                navItems.forEach(n => n.classList.remove('active')); item.classList.add('active');
                if (target === 'home') {
                    pageOverlay.classList.remove('active'); pages.forEach(p => p.classList.remove('active'));
                    isPageOpen = false; controls.enabled = true; controls.autoRotate = true;
                } else {
                    modal.classList.remove('active'); modal.classList.add('hidden-state');
                    pageOverlay.classList.add('active'); pages.forEach(p => p.classList.remove('active'));
                    document.getElementById(`page-${target}`).classList.add('active');
                    isPageOpen = true; controls.enabled = false; controls.autoRotate = true;
                }
            });
        });

        // Resizer
        resizer.addEventListener('mousedown', () => { isResizing = true; document.body.style.cursor = 'ew-resize'; resizer.classList.add('dragging'); });
        window.addEventListener('mousemove', e => {
            if (!isResizing) { mouse.x = (e.clientX/window.innerWidth)*2-1; mouse.y = -(e.clientY/window.innerHeight)*2+1; return; }
            e.preventDefault();
            document.documentElement.style.setProperty('--modal-width', `${window.innerWidth - e.clientX}px`);
        });
        window.addEventListener('mouseup', () => { isResizing = false; document.body.style.cursor = 'default'; resizer.classList.remove('dragging'); });

        // Close
        document.getElementById('close-modal').addEventListener('click', e => {
            e.stopPropagation(); modal.classList.remove('active'); modal.classList.add('hidden-state'); controls.autoRotate = true;
        });
        modal.addEventListener('click', e => e.stopPropagation());

        // Lightbox
        const lightbox = document.getElementById('lightbox-overlay');
        lightbox.addEventListener('click', e => { e.stopPropagation(); lightbox.classList.remove('active'); });
        lightbox.querySelector('.lightbox-close').addEventListener('click', () => lightbox.classList.remove('active'));

        // Prev / Next
        document.getElementById('btn-prev').addEventListener('click', () => navigateToProject(currentProjectIndex - 1));
        document.getElementById('btn-next').addEventListener('click', () => navigateToProject(currentProjectIndex + 1));

        // Search
        const searchInput = document.getElementById('project-search');
        const searchResults = document.getElementById('search-results');
        searchInput.addEventListener('input', e => {
            const q = e.target.value.toLowerCase();
            if (!q) { searchResults.classList.remove('active'); return; }
            const matches = globeProjects.filter(p => p.title.toLowerCase().includes(q) || p.airport.toLowerCase().includes(q));
            searchResults.innerHTML = matches.map(m => {
                const idx = globeProjects.findIndex(p => p.id === m.id);
                return `<div class="search-result-item" onclick="selectSearchResult(${idx})">
                    <strong>${m.title}</strong><br>
                    <span style="font-size:0.75rem;color:var(--text-muted)">${m.airport}</span>
                </div>`;
            }).join('');
            searchResults.classList.toggle('active', matches.length > 0);
        });
        window.selectSearchResult = function(index) { searchResults.classList.remove('active'); searchInput.value = ''; navigateToProject(index); };
        document.addEventListener('click', e => { if (!e.target.closest('.search-container')) searchResults.classList.remove('active'); });

        // Globe click
        window.addEventListener('click', () => {
            if (isAnimatingCamera || isResizing || isPageOpen) return;
            if (hoveredSprite?.userData) {
                if (hoveredSprite.userData.isCluster) flyTo(hoveredSprite.position, null, 1.6);
                else if (hoveredSprite.userData.data) flyTo(hoveredSprite.position, () => openModal(hoveredSprite.userData.data), 2.2);
            } else {
                modal.classList.remove('active'); modal.classList.add('hidden-state'); controls.autoRotate = true;
            }
        });

        // Touch
        window.addEventListener('touchstart', e => {
            if (e.touches.length > 0 && !modal.contains(e.target)) {
                mouse.x = (e.touches[0].clientX/window.innerWidth)*2-1;
                mouse.y = -(e.touches[0].clientY/window.innerHeight)*2+1;
            }
        }, { passive: false });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    function navigateToProject(index) {
        if (!globeProjects.length) return;
        currentProjectIndex = (index + globeProjects.length) % globeProjects.length;
        const p = globeProjects[currentProjectIndex];
        const pos = p.scenePosition || latLngToVec3(p.lat, p.lon, GLOBE_RADIUS + 0.05);
        flyTo(pos, () => openModal(p), 2.2);
    }

    // ═══════════════════════════════════════════════════════
    // ANIMATION LOOP
    // ═══════════════════════════════════════════════════════
    const raycaster = new THREE.Raycaster();

    function animate(time) {
        requestAnimationFrame(animate);
        TWEEN.update(time); controls.update();

        const now = Date.now();
        starSystems.forEach(s => { s.mesh.material.opacity = s.baseOpacity + Math.sin(now * s.speed) * 0.2; });

        const isZoomedIn = camera.position.length() < 2.8;
        clusters.forEach(c => {
            if (c.clusterSprite.visible === isZoomedIn) {
                c.clusterSprite.visible = !isZoomedIn;
                c.individualSprites.forEach(s => s.visible = isZoomedIn);
            }
        });

        if (!isPageOpen && !isAnimatingCamera) {
            raycaster.setFromCamera(mouse, camera);
            if (globeMeshRef) {
                const hits = raycaster.intersectObject(globeMeshRef);
                if (hits.length) lineUniforms.uMousePos.value.copy(hits[0].point);
                else lineUniforms.uMousePos.value.set(0,0,0);
            }
            const visibleMarkers = markers.filter(m => m.visible);
            const hits = raycaster.intersectObjects(visibleMarkers);
            if (hits.length) {
                if (hoveredSprite !== hits[0].object) {
                    if (hoveredSprite) {
                        const def = hoveredSprite.userData.isCluster ? 0.05 : 0.04;
                        hoveredSprite.scale.set(def,def,def);
                    }
                    hoveredSprite = hits[0].object;
                    hoveredSprite.scale.set(0.08,0.08,0.08);
                    document.body.style.cursor = 'pointer';
                    controls.autoRotateSpeed = 0.05;
                    const tooltip = document.getElementById('tooltip');
                    tooltip.textContent = hoveredSprite.userData.isCluster
                        ? `${hoveredSprite.userData.count} Projects`
                        : (hoveredSprite.userData.data?.airport || '');
                    tooltip.style.left = (window.innerWidth/2 + mouse.x * window.innerWidth/2 + 15) + 'px';
                    tooltip.style.top  = (window.innerHeight/2 - mouse.y * window.innerHeight/2 + 15) + 'px';
                    tooltip.style.opacity = 1;
                }
            } else {
                if (hoveredSprite) {
                    const def = hoveredSprite.userData.isCluster ? 0.05 : 0.04;
                    hoveredSprite.scale.set(def,def,def);
                    document.body.style.cursor = 'default';
                    controls.autoRotateSpeed = 0.4;
                    document.getElementById('tooltip').style.opacity = 0;
                    hoveredSprite = null;
                }
            }
        } else {
            document.getElementById('tooltip').style.opacity = 0;
            lineUniforms.uMousePos.value.set(0,0,0);
        }

        renderer.render(scene, camera);
    }

    window.onload = initApp;
    </script>
</body>
</html>
